<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>EL-Hub</title>
<meta name="theme-color" content="#0d0920">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EL-Hub">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest?v=3">
<link rel="apple-touch-icon" href="ikon-180.png?v=3">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=3">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png?v=3">
<link rel="icon" type="image/png" sizes="192x192" href="ikon-192.png?v=3">
<style>
html,body{margin:0;height:100%;position:fixed;inset:0;width:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;background:#0d0920;font-family:system-ui,sans-serif;color:#f4f1ff}
#app{position:fixed;left:0;right:0;top:env(safe-area-inset-top);width:100%;height:calc(100% - env(safe-area-inset-top) - env(safe-area-inset-bottom));border:0;background:#0d0920}
#msg{z-index:10001;pointer-events:none;position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-weight:700}
#sp0{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 70% 10%,rgba(200,241,53,.22),transparent 45%),radial-gradient(circle at 15% 90%,rgba(122,92,224,.5),transparent 50%),#0d0920;transition:opacity .4s ease}#sp0.off{opacity:0;pointer-events:none}
#sp0 .c{display:flex;flex-direction:column;align-items:center;gap:6px;color:#f4f1ff;font-family:Inter,system-ui,sans-serif}
#sp0 img{height:150px;width:auto;animation:fl 2.6s ease-in-out infinite;filter:drop-shadow(0 16px 18px rgba(0,0,0,.5))}
#sp0 b{font-family:Archivo,Inter,system-ui,sans-serif;font-weight:900;font-size:28px;letter-spacing:.02em;margin-top:6px}#sp0 span{font-size:13px;color:#c9c2ea}
#sp0 .bar{display:block;width:150px;height:4px;border-radius:4px;margin-top:14px;background:rgba(255,255,255,.14);position:relative;overflow:hidden}#sp0 .bar:after{content:"";position:absolute;left:-40%;top:0;height:100%;width:40%;border-radius:4px;background:#C8F135;animation:sl 1.1s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-1.8deg)}50%{transform:translateY(-8px) rotate(1.8deg)}}@keyframes sl{to{left:100%}}
</style></head>
<body>
<div id="sp0"><div class="c"><img src="poses/hwave.webp" alt="Elro"><b>EL-Hub</b><span>Elroi Badminton Hall</span><i class="bar"></i></div></div><div id="msg"></div>
<iframe id="app" title="EL-Hub" allow="geolocation *; camera *; clipboard-write *"></iframe>
<script>
// Link web app EL-Hub (yang berakhiran /exec). Dari Apps Script: Deploy > Manage deployments.
const ELHUB_URL = 'https://script.google.com/macros/s/AKfycby630PwrIFOrxWSFEAsbXsSXvyhDRXWs6I1CqHJuZiiMMJ-5G6W_NkCy084mIZaHL9C0g/exec';

const q = new URLSearchParams(location.search);
let dev = q.get('d');
try { if (!/^D[0-9a-f]{24}$/.test(dev || '')) dev = localStorage.getItem('elhub_dev'); } catch (e) {}
if (!/^D[0-9a-f]{24}$/.test(dev || '')) dev = 'D' + Array.from(crypto.getRandomValues(new Uint8Array(12)), b => b.toString(16).padStart(2, '0')).join('');
try { localStorage.setItem('elhub_dev', dev); } catch (e) {}
if (q.get('d') !== dev) history.replaceState(null, '', location.pathname + '?d=' + dev);

if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(ELHUB_URL)) {
  document.getElementById('sp0').style.display = 'none'; document.getElementById('msg').innerHTML = '<div>Link EL-Hub belum diisi di file index.html.</div>';
} else {
  const f = document.getElementById('app');
  const tutup = () => { const e = document.getElementById('sp0'); if (!e || e.classList.contains('off')) return; e.classList.add('off'); setTimeout(() => { e.style.display = 'none'; }, 450); };
  window.addEventListener('message', (ev) => { if (ev.data === 'elhub-ready') tutup(); }); // aplikasi memberi tanda saat halaman pertama (login atau beranda) sudah siap
  setTimeout(tutup, 15000); // cadangan bila tanda tidak datang
  const base = location.origin + location.pathname.replace(/[^/]*$/, '');
  f.src = ELHUB_URL + '?d=' + dev + '&b=' + encodeURIComponent(base);
  // jaga EL-Hub tetap hangat supaya selalu cepat: ping tiap 4 menit selama halaman terbuka
  const ping = () => { if (!document.hidden) fetch(ELHUB_URL + '?ping=1', { mode: 'no-cors', cache: 'no-store' }).catch(() => {}); };
  setInterval(ping, 240000);
}
</script>
</body></html>
