html,body{margin:0;height:100%;position:fixed;inset:0;width:100%;overflow:hidden;overscroll-behavior:none;touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;background:#0d0920;font-family:system-ui,sans-serif;color:#f4f1ff}

#sp0{pointer-events:none;position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 70% 10%,rgba(200,241,53,.22),transparent 45%),radial-gradient(circle at 15% 90%,rgba(122,92,224,.5),transparent 50%),#0d0920;transition:opacity .4s ease}#sp0.off{opacity:0;pointer-events:none}

#sp0 img{height:150px;width:auto;animation:fl 2.6s ease-in-out infinite;filter:drop-shadow(0 16px 18px rgba(0,0,0,.5))}
